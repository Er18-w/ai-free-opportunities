name: Daily source check
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
    inputs:
      full_scan:
        description: '忽略频率，核查全部非停止来源'
        required: false
        default: false
        type: boolean
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: daily-source-check
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Restore private campaign state
        uses: actions/cache@v4
        with:
          path: .runtime/state
          key: campaign-state-${{ github.run_id }}
          restore-keys: |
            campaign-state-
      - name: Discover and deduplicate opportunities first
        id: campaigns
        continue-on-error: true
        run: ${{ github.event_name == 'workflow_dispatch' && inputs.full_scan && 'npm run campaign:bootstrap' || 'npm run campaigns' }}
      - name: Check public sources
        id: daily
        continue-on-error: true
        env:
          FORCE_ALL_SOURCES: ${{ github.event_name == 'workflow_dispatch' && inputs.full_scan && '1' || '0' }}
        run: ${{ github.event_name == 'workflow_dispatch' && inputs.full_scan && 'npm run discovery:bootstrap' || 'npm run daily' }}
      - name: Build source search plan and check official pages
        id: source_plan
        continue-on-error: true
        run: ${{ github.event_name == 'workflow_dispatch' && inputs.full_scan && 'npm run sources:bootstrap' || 'npm run sources:plan' }}
      - run: npm test
      - run: npm run validate
      - run: npm run build
      - name: Store review candidates and run report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: daily-review-${{ github.run_number }}
          path: .runtime/
          retention-days: 14
          include-hidden-files: true
      - name: Commit verified data changes
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sources.json data/campaign-sources.json data/offers.json
          git commit -m "data: daily source check"
          git push
      - name: Report source failures
        if: steps.daily.outcome == 'failure' || steps.source_plan.outcome == 'failure' || steps.campaigns.outcome == 'failure'
        run: exit 1
      - name: Configure Pages
        if: steps.daily.outcome == 'success'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: steps.daily.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy Pages
        if: steps.daily.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4
